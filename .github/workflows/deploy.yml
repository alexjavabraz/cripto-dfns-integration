name: Deploy dfns-integration to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION:     us-east-1
  ECR_REPOSITORY: cripto/dfns_integration

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy dfns-integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: dfns-deploy-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            -t "$IMAGE" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            -f Dockerfile .

          docker push "$IMAGE"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ec2-user
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     ECR_REGISTRY,AWS_REGION
          script: |
            set -e
            aws ecr get-login-password --region "$AWS_REGION" | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$ECR_REGISTRY/cripto/dfns_integration:latest"
            docker rm -f dfns || true
            docker run -d \
              --name dfns \
              --restart unless-stopped \
              --env-file ~/cripto-dfns/.env \
              "$ECR_REGISTRY/cripto/dfns_integration:latest"
            docker image prune -f

      - name: Deployment summary
        run: |
          echo "✅ dfns-integration deployed to EC2"
          echo "   Host  : ${{ secrets.EC2_HOST }}"
          echo "   Image : ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
