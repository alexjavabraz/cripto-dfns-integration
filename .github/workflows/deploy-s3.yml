name: Deploy to S3

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Branch or tag to deploy (default: main)
        default: main

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false # Never cancel an in-flight deploy

jobs:
  # ─────────────────────────────────────────────
  # 1. Build
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile
        run: npx tsc   # Contracts artifacts are already committed

      - name: Set metadata
        id: meta
        run: |
          VERSION="${{ github.ref_name }}-${{ github.sha }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=dfns-integration-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Package application
        run: |
          mkdir -p package/
          cp -r dist/        package/dist/
          cp -r artifacts/   package/artifacts/
          cp package.json package-lock.json package/

          # Install production dependencies inside the package
          cd package && npm ci --omit=dev --ignore-scripts
          cd ..

          zip -r "${{ steps.meta.outputs.artifact_name }}" package/
          echo "Package size: $(du -sh ${{ steps.meta.outputs.artifact_name }})"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: ${{ steps.meta.outputs.artifact_name }}
          retention-days: 7

  # ─────────────────────────────────────────────
  # 2. Security gate before deploy
  # ─────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (critical only — blocks deploy)
        run: npm audit --audit-level=critical

      - name: Build Docker image for scan
        run: docker build -t dfns-integration:scan .

      - name: Trivy critical scan (blocks deploy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dfns-integration:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

  # ─────────────────────────────────────────────
  # 3. Deploy to S3
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy — ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: [build, security-gate]
    environment: ${{ inputs.environment || 'staging' }}

    permissions:
      id-token: write   # OIDC authentication with AWS (no long-lived keys)
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
          ARTIFACT: ${{ needs.build.outputs.artifact_name }}
          ENV: ${{ inputs.environment || 'staging' }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Upload versioned artifact
          aws s3 cp "$ARTIFACT" \
            "s3://${BUCKET}/releases/${ENV}/${ARTIFACT}" \
            --metadata "git-sha=${{ github.sha }},deployed-by=${{ github.actor }},environment=${ENV}"

          # Update latest pointer for this environment
          aws s3 cp "$ARTIFACT" \
            "s3://${BUCKET}/releases/${ENV}/dfns-integration-latest.zip"

          # Write deployment manifest
          cat <<EOF > manifest.json
          {
            "version": "${VERSION}",
            "gitSha": "${{ github.sha }}",
            "deployedBy": "${{ github.actor }}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "environment": "${ENV}",
            "artifact": "s3://${BUCKET}/releases/${ENV}/${ARTIFACT}"
          }
          EOF

          aws s3 cp manifest.json \
            "s3://${BUCKET}/releases/${ENV}/manifest.json"

          echo "✅ Deployed to s3://${BUCKET}/releases/${ENV}/${ARTIFACT}"

      # ── Optional: trigger CodeDeploy after S3 upload ──────────────────
      # Uncomment and configure when ready to use AWS CodeDeploy or ECS.
      #
      # - name: Trigger CodeDeploy
      #   run: |
      #     aws deploy create-deployment \
      #       --application-name dfns-integration \
      #       --deployment-group-name ${{ vars.CODEDEPLOY_GROUP }} \
      #       --s3-location bucket=${{ vars.S3_BUCKET }},key=releases/${{ inputs.environment || 'staging' }}/${{ needs.build.outputs.artifact_name }},bundleType=zip
      #
      # - name: Trigger ECS rolling update
      #   run: |
      #     aws ecs update-service \
      #       --cluster ${{ vars.ECS_CLUSTER }} \
      #       --service dfns-integration \
      #       --force-new-deployment

  # ─────────────────────────────────────────────
  # 4. Post-deploy notification
  # ─────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Deployment summary
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Deploy succeeded: ${{ needs.build.outputs.version }} → ${{ inputs.environment || 'staging' }}"
          else
            echo "❌ Deploy failed: ${{ needs.build.outputs.version }} → ${{ inputs.environment || 'staging' }}"
          fi

      # ── Optional: Slack notification ──────────────────────────────────
      # - name: Notify Slack
      #   uses: slackapi/slack-github-action@v1
      #   with:
      #     payload: |
      #       {
      #         "text": "${{ needs.deploy.result == 'success' && '✅' || '❌' }} dfns-integration deployed to ${{ inputs.environment || 'staging' }} — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
      #       }
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
